services:
  - type: web
    name: employee-management-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: CLIENT_ORIGIN
        value: https://employeemanagamentsystem-7.onrender.com

  - type: web
    name: employee-management-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://employeemanagamentsystem-8.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
