services:
  - type: web
    name: employee-management-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start

  - type: web
    name: employee-management-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
